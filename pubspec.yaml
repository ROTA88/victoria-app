name: victoria_app
description: "Diário da Victoria - App premium para monitoramento do bebê."

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
    
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.18.3
  google_fonts: ^6.2.1 # Adicionado para tipografia Premium (ex: Nunito/Poppins)
  fl_chart: ^1.3.0
  intl: ^0.20.3
  pdf: ^3.13.1
  printing: ^5.15.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Declarando os assets para que o Flutter consiga exibir a foto no Header
  assets:
    - assets/icone.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icone.png"
  min_sdk_android: 21

